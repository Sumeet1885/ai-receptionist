# docker-compose-staging.yml
#
# This file is used by the EC2 server (NOT for local development).
# Images are pre-built and pushed by the GitHub Actions 'docker-image-staging.yml' workflow.
# IMAGE_TAG_SERVER and IMAGE_TAG_CLIENT in the .env file on EC2 are updated
# automatically by the 'deploy-via-ssm.yml' workflow on every deployment.
#
# EC2 .env must contain at minimum:
#   IMAGE_TAG_SERVER=ai-receptionist-server-staging-<short-sha>
#   IMAGE_TAG_CLIENT=ai-receptionist-client-staging-<short-sha>
#   APP_DOMAIN=your-app-domain.com
#   API_DOMAIN=api.your-app-domain.com
#   DOCKER_USERNAME=your-dockerhub-username

services:
  api:
    image: ${DOCKER_USERNAME}/recrui8-dockerhub-repo-dev:${IMAGE_TAG_SERVER}
    container_name: ai-receptionist-api
    # All server secrets live in server/.env on the EC2 instance.
    # Copy your server/.env to the EC2 project folder before first deploy.
    env_file:
      - ./server/.env
    expose:
      - "4000"
    restart: unless-stopped
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "ap-south-1"
        awslogs-group: "/ai-receptionist/staging"
        awslogs-stream: "api"
        awslogs-create-group: "true"

  web:
    image: ${DOCKER_USERNAME}/recrui8-dockerhub-repo-dev:${IMAGE_TAG_CLIENT}
    container_name: ai-receptionist-web
    # Caddy uses APP_DOMAIN and API_DOMAIN to provision TLS certs and route traffic.
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "ap-south-1"
        awslogs-group: "/ai-receptionist/staging"
        awslogs-stream: "web"
        awslogs-create-group: "true"

volumes:
  caddy_data:
  caddy_config:
