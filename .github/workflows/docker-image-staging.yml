name: STAGING - Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full Commit SHA to build from"
        required: true

jobs:
  build-and-push:
    # Safety guard: only allow this workflow to run from the staging branch
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code at specified commit
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.commit_sha }}

      - name: Compute short commit SHA
        run: |
          COMMIT_SHA="${{ github.event.inputs.commit_sha }}"
          SHORT_SHA=$(echo $COMMIT_SHA | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Set deployment environment
        run: echo "DEPLOYMENT_ENV=staging" >> $GITHUB_ENV

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── Server ──────────────────────────────────────────────────────────────
      - name: Build Server Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg deployment_env=${{ env.DEPLOYMENT_ENV }} \
            -t ${{ secrets.DOCKER_USERNAME }}/ai-receptionist:server-staging-${{ env.SHORT_SHA }} \
            -f server/Dockerfile \
            ./server

      - name: Push Server Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ai-receptionist:server-staging-${{ env.SHORT_SHA }}

      # ── Client ──────────────────────────────────────────────────────────────
      - name: Build Client Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            --build-arg VITE_EXPRESS_SERVER_URL="${{ secrets.VITE_EXPRESS_SERVER_URL }}" \
            --build-arg VITE_WIDGET_BASE_URL="${{ secrets.VITE_WIDGET_BASE_URL }}" \
            -t ${{ secrets.DOCKER_USERNAME }}/ai-receptionist:client-staging-${{ env.SHORT_SHA }} \
            -f client/Dockerfile \
            ./client

      - name: Push Client Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ai-receptionist:client-staging-${{ env.SHORT_SHA }}

      - name: Summary
        run: |
          echo "### ✅ Docker Images Pushed" >> $GITHUB_STEP_SUMMARY
          echo "- **Server:** \`${{ secrets.DOCKER_USERNAME }}/ai-receptionist:server-staging-${{ env.SHORT_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Client:** \`${{ secrets.DOCKER_USERNAME }}/ai-receptionist:client-staging-${{ env.SHORT_SHA }}\`" >> $GITHUB_STEP_SUMMARY
