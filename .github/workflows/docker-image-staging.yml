name: STAGING - Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full Commit SHA to build from"
        required: true

jobs:
  build-and-push:
    # Safety guard: only allow this workflow to run from the staging branch
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code at specified commit
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.commit_sha }}

      - name: Compute short commit SHA
        run: |
          COMMIT_SHA="${{ github.event.inputs.commit_sha }}"
          SHORT_SHA=$(echo $COMMIT_SHA | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Set deployment environment
        run: echo "DEPLOYMENT_ENV=staging" >> $GITHUB_ENV

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── Server ──────────────────────────────────────────────────────────────
      - name: Build Server Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg deployment_env=${{ env.DEPLOYMENT_ENV }} \
            -t ${{ secrets.DOCKER_USERNAME }}/recrui8-dockerhub-repo-dev:ai-receptionist-server-staging-${{ env.SHORT_SHA }} \
            -f apps/api/Dockerfile \
            .

      - name: Push Server Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/recrui8-dockerhub-repo-dev:ai-receptionist-server-staging-${{ env.SHORT_SHA }}

      # ── Client ──────────────────────────────────────────────────────────────
      # Browser-public defaults live in the Dockerfile; the website origin is configured below.
      # Public SEO domain comes from repository Variables; this is not a secret.
      - name: Build Client Docker image
        env:
          SITE_URL: ${{ vars.STAGING_SITE_URL }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VITE_SITE_URL="$SITE_URL" \
            -t ${{ secrets.DOCKER_USERNAME }}/recrui8-dockerhub-repo-dev:ai-receptionist-client-staging-${{ env.SHORT_SHA }} \
            -f apps/web/Dockerfile.staging \
            .

      - name: Push Client Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/recrui8-dockerhub-repo-dev:ai-receptionist-client-staging-${{ env.SHORT_SHA }}

      - name: Summary
        run: |
          echo "### ✅ Docker Images Pushed" >> $GITHUB_STEP_SUMMARY
          echo "- **Server:** \`${{ secrets.DOCKER_USERNAME }}/recrui8-dockerhub-repo-dev:ai-receptionist-server-staging-${{ env.SHORT_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Client:** \`${{ secrets.DOCKER_USERNAME }}/recrui8-dockerhub-repo-dev:ai-receptionist-client-staging-${{ env.SHORT_SHA }}\`" >> $GITHUB_STEP_SUMMARY
