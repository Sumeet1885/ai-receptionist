name: PRODUCTION - Deploy via AWS SSM

# Same steps as the staging deploy: apply pending database migrations, check for paused
# campaigns, then point the host at the production images built by "PRODUCTION - Build and Push
# Docker Images" for the same commit and restart. Both jobs use the "production" environment:
# give it required reviewers so every production deploy needs an explicit approval.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full Commit SHA to deploy (must already be built by the production image workflow)"
        required: true
      allow_paused_campaigns:
        description: "Allow paused outbound campaigns to resume dialing after the restart"
        type: boolean
        default: false

jobs:
  # Database first: pending migrations are applied before the new containers start, and the
  # deploy stops if a migration fails or paused campaigns would resume without confirmation.
  migrate:
    if: github.ref == 'refs/heads/staging'
    uses: ./.github/workflows/database-migrate.yml
    with:
      environment: production
      action: apply
      commit_sha: ${{ github.event.inputs.commit_sha }}
      block_on_paused_campaigns: true
      allow_paused_campaigns: ${{ inputs.allow_paused_campaigns }}
    secrets: inherit

  deploy:
    needs: migrate
    # Same guard as the production image workflow: only dispatch from the staging branch.
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Send SSM command to EC2
        run: |
          COMMIT_SHA="${{ github.event.inputs.commit_sha }}"
          SHORT_SHA=$(echo $COMMIT_SHA | cut -c1-7)

          aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploying ai-receptionist PRODUCTION commit $SHORT_SHA" \
            --parameters '{
              "commands": [
                "set -e",
                "cd /home/ec2-user/ai-receptionist",
                "echo 🔐 Fetching DockerHub password from AWS Secrets Manager...",
                "DOCKER_PASS=$(aws secretsmanager get-secret-value --secret-id dockerhub-ai-receptionist-password --query SecretString --output text)",
                "echo 🔑 Logging in to Docker Hub...",
                "echo $DOCKER_PASS | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin",
                "echo ✏️  Updating .env with new image tags...",
                "sed -i \"s/^IMAGE_TAG_SERVER=.*/IMAGE_TAG_SERVER=ai-receptionist-server-prod-'"$SHORT_SHA"'/\" .env",
                "sed -i \"s/^IMAGE_TAG_CLIENT=.*/IMAGE_TAG_CLIENT=ai-receptionist-client-prod-'"$SHORT_SHA"'/\" .env",
                "echo 📄 Updated image tags:",
                "grep '"'"'^IMAGE_TAG_'"'"' .env",
                "echo 🚀 Pulling and restarting containers...",
                "docker-compose -f docker-compose-prod.yml up -d",
                "echo ⏳ Waiting 30s for containers to stabilise...",
                "sleep 30",
                "echo 🧹 Pruning old images...",
                "docker image prune -a -f",
                "echo 📊 Container status:",
                "docker-compose -f docker-compose-prod.yml ps",
                "EXIT_CONTAINERS=$(docker-compose -f docker-compose-prod.yml ps | grep Exit || true)",
                "if [ -n \"$EXIT_CONTAINERS\" ]; then echo \"❌ Some containers exited: $EXIT_CONTAINERS\" && exit 1; else echo \"✅ Deployment successful — all containers running\"; fi"
              ]
            }'

      - name: Summary
        run: |
          COMMIT_SHA="${{ github.event.inputs.commit_sha }}"
          SHORT_SHA=$(echo $COMMIT_SHA | cut -c1-7)
          echo "### ✅ PRODUCTION SSM Deploy Command Sent" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`$SHORT_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Instance:** \`${{ secrets.EC2_INSTANCE_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "> Check AWS Systems Manager → Run Command for live execution logs." >> $GITHUB_STEP_SUMMARY
