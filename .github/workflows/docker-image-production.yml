name: PRODUCTION - Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full Commit SHA to build from"
        required: true

jobs:
  build-and-push:
    # Safety guard: only allow this workflow to run from production/staging branches
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code at specified commit
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.commit_sha }}

      - name: Compute short commit SHA
        run: |
          COMMIT_SHA="${{ github.event.inputs.commit_sha }}"
          SHORT_SHA=$(echo $COMMIT_SHA | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Set deployment environment
        run: echo "DEPLOYMENT_ENV=production" >> $GITHUB_ENV

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── Server ──────────────────────────────────────────────────────────────
      - name: Build Server Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg deployment_env=${{ env.DEPLOYMENT_ENV }} \
            -t ${{ secrets.DOCKER_USERNAME }}/recrui8-dockerhub-repo-dev:ai-receptionist-server-prod-${{ env.SHORT_SHA }} \
            -f apps/api/Dockerfile \
            .

      - name: Push Server Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/recrui8-dockerhub-repo-dev:ai-receptionist-server-prod-${{ env.SHORT_SHA }}

      # ── Client ──────────────────────────────────────────────────────────────
      # VITE_* values are baked into apps/web/Dockerfile.prod (recrui8-style).
      # No --build-arg secrets needed — production URLs live in the Dockerfile itself.
      - name: Build Client Docker image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ secrets.DOCKER_USERNAME }}/recrui8-dockerhub-repo-dev:ai-receptionist-client-prod-${{ env.SHORT_SHA }} \
            -f apps/web/Dockerfile.prod \
            .

      - name: Push Client Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/recrui8-dockerhub-repo-dev:ai-receptionist-client-prod-${{ env.SHORT_SHA }}

      - name: Summary
        run: |
          echo "### ✅ Production Docker Images Pushed" >> $GITHUB_STEP_SUMMARY
          echo "- **Server:** \`${{ secrets.DOCKER_USERNAME }}/recrui8-dockerhub-repo-dev:ai-receptionist-server-prod-${{ env.SHORT_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Client:** \`${{ secrets.DOCKER_USERNAME }}/recrui8-dockerhub-repo-dev:ai-receptionist-client-prod-${{ env.SHORT_SHA }}\`" >> $GITHUB_STEP_SUMMARY
