name: Build project

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging
  schedule:
    - cron: '0 0 * * *' # Every day at midnight UTC

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev

    strategy:
      matrix:
        include:
          - folder: client
            build_cmd: npm run build
          - folder: server
            build_cmd: npm run typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.11.1"

      - name: Install dependencies
        working-directory: ${{ matrix.folder }}
        run: npm ci

      - name: Build / Typecheck
        working-directory: ${{ matrix.folder }}
        run: ${{ matrix.build_cmd }}
        env:
          # Vite bakes these into the client bundle at build time.
          # Add them as Variables (not Secrets) in GitHub → Settings → Secrets and Variables → Actions → Variables
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_EXPRESS_SERVER_URL: ${{ vars.VITE_EXPRESS_SERVER_URL }}
          VITE_WIDGET_BASE_URL: ${{ vars.VITE_WIDGET_BASE_URL }}
