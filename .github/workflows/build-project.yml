name: STAGING - Build project

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full Commit SHA to build and verify"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging

    strategy:
      matrix:
        include:
          - folder: client
            build_cmd: npm run build
          - folder: server
            build_cmd: npm run typecheck

    steps:
      - name: Checkout code at specified commit
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.commit_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.11.1"

      - name: Install dependencies
        working-directory: ${{ matrix.folder }}
        run: npm ci

      - name: Build / Typecheck
        working-directory: ${{ matrix.folder }}
        run: ${{ matrix.build_cmd }}
        env:
          # Vite bakes these into the client bundle at build time.
          # Add them as Variables (not Secrets) in GitHub → Settings → Secrets and Variables → Actions → Variables
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_EXPRESS_SERVER_URL: ${{ vars.VITE_EXPRESS_SERVER_URL }}
          VITE_WIDGET_BASE_URL: ${{ vars.VITE_WIDGET_BASE_URL }}

      - name: Summary
        run: |
          echo "### ✅ Build Verified" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.event.inputs.commit_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Jobs:** client (build) + server (typecheck)" >> $GITHUB_STEP_SUMMARY
