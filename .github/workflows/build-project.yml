name: Build project
run-name: Build project - ${{ inputs.environment }} - ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: staging
        options: [staging, production]
      commit_sha:
        description: "Optional full commit SHA from the selected branch; leave blank to use its latest commit"
        type: string
        required: false

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout selected branch or commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}
          fetch-depth: 0

      - name: Resolve and validate commit
        id: revision
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_SHA" ]; then
            [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::Use a full 40-character commit SHA."; exit 1; }
            git merge-base --is-ancestor HEAD "origin/$GITHUB_REF_NAME" || { echo "::error::Commit must belong to the selected branch."; exit 1; }
          fi
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: pnpm exec turbo run typecheck build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_EXPRESS_SERVER_URL: ${{ vars.VITE_EXPRESS_SERVER_URL }}
          VITE_WIDGET_BASE_URL: ${{ vars.VITE_WIDGET_BASE_URL }}
          VITE_SITE_URL: ${{ vars[format('{0}_SITE_URL', inputs.environment == 'production' && 'PRODUCTION' || 'STAGING')] }}
          VITE_INDEXABLE: ${{ inputs.environment == 'production' && 'true' || 'false' }}
      - name: Check browser/server import boundaries
        run: pnpm run check:boundaries
      - name: Summary
        env:
          SHA: ${{ steps.revision.outputs.sha }}
          TARGET: ${{ inputs.environment }}
        run: |
          echo "### Build verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: $TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $SHA" >> "$GITHUB_STEP_SUMMARY"
