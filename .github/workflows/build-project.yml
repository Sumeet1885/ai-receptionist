name: STAGING - Build project

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full Commit SHA to build and verify"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code at specified commit
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.commit_sha }}

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies (all workspaces)
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build (web, api, admin, contracts)
        run: pnpm exec turbo run typecheck build
        env:
          # Vite bakes these into the client bundle at build time.
          # Add them as Variables (not Secrets) in GitHub → Settings → Secrets and Variables → Actions → Variables
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_EXPRESS_SERVER_URL: ${{ vars.VITE_EXPRESS_SERVER_URL }}
          VITE_WIDGET_BASE_URL: ${{ vars.VITE_WIDGET_BASE_URL }}

      - name: Check browser/server import boundaries
        run: pnpm run check:boundaries

      - name: Summary
        run: |
          echo "### ✅ Build Verified" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.event.inputs.commit_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Jobs:** typecheck + build (web, admin), typecheck (api, contracts), boundary check" >> $GITHUB_STEP_SUMMARY
