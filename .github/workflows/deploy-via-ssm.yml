name: Deploy via AWS SSM
run-name: Deploy - ${{ inputs.environment }} - ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: staging
        options: [staging, production]
      commit_sha:
        description: "Optional full commit SHA from the selected branch; leave blank to use its latest commit"
        type: string
        required: false
      allow_paused_campaigns:
        description: Allow paused outbound campaigns to resume dialing after restart
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      short_sha: ${{ steps.revision.outputs.short_sha }}
    steps:
      - name: Checkout selected branch or commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.ref }}
          fetch-depth: 0

      - name: Resolve and validate commit
        id: revision
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_SHA" ]; then
            [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::Use a full 40-character commit SHA."; exit 1; }
            git merge-base --is-ancestor HEAD "origin/$GITHUB_REF_NAME" || { echo "::error::Commit must belong to the selected branch."; exit 1; }
          fi
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

  migrate:
    needs: resolve
    uses: ./.github/workflows/database-migrate.yml
    with:
      environment: ${{ inputs.environment }}
      action: apply
      commit_sha: ${{ needs.resolve.outputs.sha }}
      block_on_paused_campaigns: true
      allow_paused_campaigns: ${{ inputs.allow_paused_campaigns }}
    secrets: inherit
  deploy:
    needs: [resolve, migrate]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Build SSM parameters
        env:
          TARGET: ${{ inputs.environment }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          python3 - <<'PY'
          import json, os, re, shlex
          target = os.environ["TARGET"]
          assert target in ("staging", "production")
          short_sha = os.environ["SHORT_SHA"]
          assert re.fullmatch(r"[0-9a-f]{7}", short_sha)
          tag = "prod" if target == "production" else "staging"
          compose = f"docker-compose-{tag}.yml"
          username = shlex.quote(os.environ["DOCKER_USERNAME"])
          commands = [
              "set -eu",
              "cd /home/ec2-user/ai-receptionist",
              "DOCKER_PASS=$(aws secretsmanager get-secret-value --secret-id dockerhub-ai-receptionist-password --query SecretString --output text)",
              f'printf "%s" "$DOCKER_PASS" | docker login -u {username} --password-stdin',
              "unset DOCKER_PASS",
              f'sed -i "s/^IMAGE_TAG_SERVER=.*/IMAGE_TAG_SERVER=ai-receptionist-server-{tag}-{short_sha}/" .env',
              f'sed -i "s/^IMAGE_TAG_CLIENT=.*/IMAGE_TAG_CLIENT=ai-receptionist-client-{tag}-{short_sha}/" .env',
              f"docker-compose -f {compose} pull",
              f"docker-compose -f {compose} up -d",
              "sleep 30",
              f"docker-compose -f {compose} ps",
              f'CONTAINERS=$(docker-compose -f {compose} ps -q)',
              'test -n "$CONTAINERS"',
              'for container in $CONTAINERS; do test "$(docker inspect --format "{{.State.Running}}" "$container")" = true; done',
          ]
          with open("ssm-parameters.json", "w") as output:
              json.dump({"commands": commands}, output)
          PY
      - name: Send SSM command and wait for result
        timeout-minutes: 15
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          TARGET: ${{ inputs.environment }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ai-receptionist $TARGET $SHORT_SHA" \
            --parameters file://ssm-parameters.json \
            --timeout-seconds 600 \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"
          for attempt in $(seq 1 80); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "::error::SSM deployment ended with status $STATUS. Check AWS Run Command $COMMAND_ID."
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for SSM command $COMMAND_ID. Check AWS Run Command."
          exit 1
      - name: Summary
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          TARGET: ${{ inputs.environment }}
        run: |
          echo "### Deployment completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: $TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $SHA" >> "$GITHUB_STEP_SUMMARY"
